services:
  nginx:
    image: nginx:alpine
    container_name: fiberops-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs-web
    restart: always

  nextjs-web:
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
    container_name: fiberops-web
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://fiberops:fiberops_secure_pass@postgres:5432/fiberops_db?schema=public
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=fiberops_minio_admin
      - MINIO_SECRET_KEY=fiberops_minio_secret_pass
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - postgres
      - redis
      - minio
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M

  postgres:
    image: postgres:16-alpine
    container_name: fiberops-postgres
    environment:
      - POSTGRES_USER=fiberops
      - POSTGRES_PASSWORD=fiberops_secure_pass
      - POSTGRES_DB=fiberops_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M

  redis:
    image: redis:7-alpine
    container_name: fiberops-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  minio:
    image: minio/minio:latest
    container_name: fiberops-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=fiberops_minio_admin
      - MINIO_ROOT_PASSWORD=fiberops_minio_secret_pass
    volumes:
      - minio_data:/data
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: fiberops-ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: always
    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 8192M
        reservations:
          memory: 4096M

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_models:
