services:
  nginx:
    image: nginx:alpine
    container_name: fiberops-nginx
    ports:
      - "${WEB_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      nextjs-web:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nextjs-web:
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
    container_name: fiberops-web
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://fiberops:fiberops_secure_pass@postgres:5432/fiberops_db?schema=public
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_BUCKET=fiberops-proofs
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-fiberops_minio_admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-fiberops_minio_secret_pass}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:${WEB_HTTP_PORT:-8080}}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - JWT_SECRET=${JWT_SECRET:-fiberops_on_premise_super_secure_jwt_secret_key_32chars}
      - HMAC_ACTION_SECRET=${HMAC_ACTION_SECRET:-fiberops_action_secret_token_default_32_chars}
      - NGINX_HEALTH_URL=${NGINX_HEALTH_URL:-http://nginx/api/v1/health}
      - STRICT_LIVE_DATA=${STRICT_LIVE_DATA:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: fiberops-postgres
    environment:
      - POSTGRES_USER=fiberops
      - POSTGRES_PASSWORD=fiberops_secure_pass
      - POSTGRES_DB=fiberops_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiberops -d fiberops_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: fiberops-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:latest
    container_name: fiberops-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=fiberops_minio_admin
      - MINIO_ROOT_PASSWORD=fiberops_minio_secret_pass
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ollama:
    profiles:
      - linux-docker-ai
    image: ollama/ollama:latest
    container_name: fiberops-ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: always
    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 8192M
        reservations:
          memory: 4096M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_models:
