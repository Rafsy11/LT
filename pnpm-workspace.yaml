packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.152'
  - ai@7.0.179

overrides:
  undici: '^7.30.1'
  postcss: '>=8.5.23'
  decode-uri-component: '>=0.5.1'
  fast-xml-parser: '>=5.12.0'
  'minimatch@<3.1.4': '>=3.1.4'
  'minimatch@>=5.0.0 <5.1.8': '>=5.1.8'
  'minimatch@>=7.0.0 <11.0.1': '>=11.0.1'
  tmp: '>=0.2.6'
  deepmerge-ts: '>=8.0.0'
  effect: '^3.22.1'
  stream-json: '>=3.6.0'
  uuid: '>=11.1.1'

patchedDependencies:
  minio@8.0.7: patches/minio@8.0.7.patch
