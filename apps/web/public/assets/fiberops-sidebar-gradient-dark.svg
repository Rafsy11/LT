<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1200" viewBox="0 0 320 1200" preserveAspectRatio="none" shape-rendering="geometricPrecision">
  <defs>
    <!-- Base Deep Slate Gradient (Slate 900 to Slate 950) -->
    <linearGradient id="sideDarkBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="22%" stop-color="#0E1628"/>
      <stop offset="48%" stop-color="#0A1222"/>
      <stop offset="68%" stop-color="#070E1A"/>
      <stop offset="88%" stop-color="#040913"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Translucent Slate Wave Gradient 1 -->
    <linearGradient id="sideWaveDark1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#1E3A5F" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Translucent Slate Wave Gradient 2 -->
    <linearGradient id="sideWaveDark2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#1E3A5F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Ambient Subtle Cloud Swell Gradient -->
    <radialGradient id="sideCloudGlow" cx="80%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#1E3A5F" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full Atmospheric Deep Slate Tone -->
  <rect width="320" height="1200" fill="url(#sideDarkBase)"/>

  <!-- Subtle Ambient Mid-Height Cloud Glow -->
  <rect width="320" height="600" y="200" fill="url(#sideCloudGlow)"/>

  <!-- Upper-Right Subtle Cloud Swell -->
  <path d="M320 400 C220 445, 200 525, 320 590 Z" fill="#1E293B" opacity="0.32"/>
  <path d="M320 400 C220 445, 200 525, 320 590" fill="none" stroke="#2585D0" stroke-opacity="0.22" stroke-width="1.6"/>

  <!-- Middle-Left Soft Atmospheric Billow -->
  <path d="M0 490 C110 530, 130 610, 0 670 Z" fill="#1E3A5F" opacity="0.2"/>
  <path d="M0 490 C110 530, 130 610, 0 670" fill="none" stroke="#38BDF8" stroke-opacity="0.15" stroke-width="1.4"/>

  <!-- Primary Sweeping Diagonal Wave Ribbon (Deep Slate Wave) -->
  <path d="M0 860 C90 840, 190 740, 320 660 L320 1200 L0 1200 Z" fill="url(#sideWaveDark1)"/>
  <path d="M0 860 C90 840, 190 740, 320 660" fill="none" stroke="#2585D0" stroke-opacity="0.32" stroke-width="1.8"/>

  <!-- Secondary Deeper Wave Ribbon at Bottom-Left -->
  <path d="M0 990 C80 970, 180 890, 320 810 L320 1200 L0 1200 Z" fill="url(#sideWaveDark2)"/>
  <path d="M0 990 C80 970, 180 890, 320 810" fill="none" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.6"/>

  <!-- Delicate Lower Accent Wave -->
  <path d="M0 1100 C70 1080, 170 1020, 320 960 L320 1200 L0 1200 Z" fill="#0F172A" opacity="0.45"/>
  <path d="M0 1100 C70 1080, 170 1020, 320 960" fill="none" stroke="#2585D0" stroke-opacity="0.18" stroke-width="1.4"/>

  <!-- Right Subtle Border Line (Slate 800) -->
  <path d="M319 0 L319 1200" stroke="#1E293B" stroke-opacity="0.85" stroke-width="1"/>
</svg>

