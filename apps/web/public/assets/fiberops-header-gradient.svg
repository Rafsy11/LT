<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="80" viewBox="0 0 1600 80" preserveAspectRatio="none">
  <defs>
    <!-- Authentic Sky Gradient from Lintasarta Sky Dashboard -->
    <linearGradient id="headerSkyBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8defe"/>
      <stop offset="35%" stop-color="#cbe6fd"/>
      <stop offset="70%" stop-color="#e1f1fe"/>
      <stop offset="100%" stop-color="#e8f5fe"/>
    </linearGradient>

    <!-- Horizontal Atmospheric Variation -->
    <linearGradient id="headerSkyHorizontal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d7edfe" stop-opacity="0.9"/>
      <stop offset="18%" stop-color="#b4dcfe" stop-opacity="0.95"/>
      <stop offset="42%" stop-color="#e8f5fe" stop-opacity="0.85"/>
      <stop offset="58%" stop-color="#e8f5fe" stop-opacity="0.85"/>
      <stop offset="82%" stop-color="#b6dcfe" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d2ebfe" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Luminous Cloud Center Behind Search Input -->
    <radialGradient id="searchCloudGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="55%" stop-color="#f2f9ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d4ebfd" stop-opacity="0"/>
    </radialGradient>

    <!-- Translucent Diagonal Wave Ribbons from Top Right -->
    <linearGradient id="diagWaveA" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0dbfd" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#d8edfe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Sky Fill -->
  <rect width="1600" height="80" fill="url(#headerSkyBase)"/>
  <rect width="1600" height="80" fill="url(#headerSkyHorizontal)"/>

  <!-- Search Bar Cloud Highlight -->
  <ellipse cx="800" cy="38" rx="420" ry="34" fill="url(#searchCloudGlow)"/>

  <!-- Soft Diagonal Sky Curves (matching reference) -->
  <path d="M960 0 C1140 18, 1320 48, 1600 58 L1600 0 Z" fill="url(#diagWaveA)"/>
  <path d="M0 0 C240 22, 420 45, 680 48 L680 0 Z" fill="#ffffff" opacity="0.22"/>

  <!-- Gentle Cloud Outline -->
  <path d="M0 68 C380 48, 620 62, 980 50 C1240 40, 1420 58, 1600 44" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.6"/>
  <path d="M0 79 L1600 79" stroke="#c8e0f4" stroke-opacity="0.75" stroke-width="1"/>
</svg>