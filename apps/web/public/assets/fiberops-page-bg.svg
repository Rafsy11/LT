<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" preserveAspectRatio="none">
  <defs>
    <!-- Multi-Stage Gaussian Blur Filters for Natural Depth of Optical Blue Lines -->
    <filter id="blurAmbientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
    <filter id="blurMediumStream" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="8.5" />
    </filter>
    <filter id="blurFineHatch" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.2" />
    </filter>

    <!-- Calibrated Optical Blue Gradients for Uniform Hatching & Streamlines -->
    <linearGradient id="streamGradAzure" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.32" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="70%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.18" />
    </linearGradient>

    <linearGradient id="streamGradCyan" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.26" />
      <stop offset="75%" stop-color="#93c5fd" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="streamGradCobalt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.24" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="85%" stop-color="#0284c7" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="waveFillRibbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.32" />
      <stop offset="40%" stop-color="#e0f2fe" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#f0f9ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Diagonal Optical Hatching Pattern (Evenly Distributed Across Whole Canvas) -->
    <pattern id="evenDiagonalHatch" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="48" stroke="#0ea5e9" stroke-width="1.8" stroke-opacity="0.065" />
      <line x1="24" y1="0" x2="24" y2="48" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.045" />
    </pattern>
  </defs>

  <!-- Clean Pure White Base Canvas -->
  <rect width="1600" height="1200" fill="#ffffff" />

  <!-- 1. Evenly Distributed Fine Diagonal Hatch Texture (Merata di Seluruh Kanvas) -->
  <rect width="1600" height="1200" fill="url(#evenDiagonalHatch)" />

  <!-- 2. Ambient Blurred Luminous Blue Waves (Broad Soft Atmospheric Undercurrents) -->
  <g filter="url(#blurAmbientGlow)">
    <!-- Header top zone -->
    <path d="M-40 24 C280 -10, 580 65, 960 20 C1240 -15, 1450 55, 1640 18 L1640 95 C1450 130, 1240 60, 960 95 C580 140, 280 60, -40 90 Z" fill="url(#waveFillRibbon)" />
    <!-- Upper zone (y: 200-300) -->
    <path d="M-30 220 C340 160, 720 280, 1120 200 C1380 145, 1500 230, 1630 185" fill="none" stroke="url(#streamGradAzure)" stroke-width="28" stroke-linecap="round" />
    <!-- Mid-upper zone (y: 420-520) -->
    <path d="M-30 450 C360 380, 750 510, 1160 430 C1390 380, 1510 460, 1630 415" fill="none" stroke="url(#streamGradCyan)" stroke-width="26" stroke-linecap="round" />
    <!-- Center zone (y: 650-750) -->
    <path d="M-30 680 C350 620, 740 740, 1150 660 C1380 610, 1500 690, 1630 650" fill="none" stroke="url(#streamGradCobalt)" stroke-width="24" stroke-linecap="round" />
    <!-- Lower-mid zone (y: 880-980) -->
    <path d="M-30 910 C360 840, 760 960, 1180 880 C1400 830, 1520 910, 1630 870" fill="none" stroke="url(#streamGradAzure)" stroke-width="26" stroke-linecap="round" />
    <!-- Bottom zone (y: 1080-1180) -->
    <path d="M-30 1120 C380 1060, 780 1170, 1200 1100 C1420 1050, 1530 1120, 1630 1090" fill="none" stroke="url(#streamGradCyan)" stroke-width="24" stroke-linecap="round" />
  </g>

  <!-- 3. Evenly Distributed Medium Blurred Blue Streamlines (Rhythmic Flow Spaced Every ~80-100px) -->
  <g filter="url(#blurMediumStream)">
    <path d="M-20 40 C310 12, 620 72, 980 32 C1260 2, 1450 58, 1620 28" fill="none" stroke="url(#streamGradAzure)" stroke-width="9" stroke-linecap="round" />
    <path d="M-20 125 C330 85, 660 155, 1040 105 C1310 70, 1480 135, 1620 100" fill="none" stroke="url(#streamGradCyan)" stroke-width="7.5" stroke-linecap="round" />
    <path d="M-20 215 C340 165, 690 245, 1080 185 C1340 140, 1490 215, 1620 175" fill="none" stroke="url(#streamGradCobalt)" stroke-width="8" stroke-linecap="round" />
    <path d="M-20 305 C350 255, 710 335, 1110 270 C1360 220, 1500 295, 1620 255" fill="none" stroke="url(#streamGradAzure)" stroke-width="7" stroke-linecap="round" />
    <path d="M-20 395 C360 340, 730 420, 1140 355 C1380 305, 1510 380, 1620 340" fill="none" stroke="url(#streamGradCyan)" stroke-width="8" stroke-linecap="round" />
    <path d="M-20 485 C370 430, 750 510, 1170 440 C1400 390, 1520 465, 1620 425" fill="none" stroke="url(#streamGradCobalt)" stroke-width="7.5" stroke-linecap="round" />
    <path d="M-20 575 C380 520, 770 600, 1200 530 C1420 480, 1530 550, 1620 510" fill="none" stroke="url(#streamGradAzure)" stroke-width="8.5" stroke-linecap="round" />
    <path d="M-20 665 C390 610, 790 690, 1220 615 C1440 565, 1540 635, 1620 600" fill="none" stroke="url(#streamGradCyan)" stroke-width="7" stroke-linecap="round" />
    <path d="M-20 755 C400 700, 810 780, 1240 705 C1450 655, 1550 725, 1620 690" fill="none" stroke="url(#streamGradCobalt)" stroke-width="8" stroke-linecap="round" />
    <path d="M-20 845 C410 790, 830 870, 1260 795 C1470 745, 1560 815, 1620 780" fill="none" stroke="url(#streamGradAzure)" stroke-width="7.5" stroke-linecap="round" />
    <path d="M-20 935 C420 880, 850 960, 1280 885 C1490 835, 1570 905, 1620 870" fill="none" stroke="url(#streamGradCyan)" stroke-width="8.5" stroke-linecap="round" />
    <path d="M-20 1025 C430 970, 870 1050, 1300 975 C1500 925, 1580 995, 1620 960" fill="none" stroke="url(#streamGradCobalt)" stroke-width="7" stroke-linecap="round" />
    <path d="M-20 1115 C440 1060, 890 1140, 1320 1065 C1520 1015, 1590 1085, 1620 1050" fill="none" stroke="url(#streamGradAzure)" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- 4. Soft Precision Blurred Hatch Lines (Kesan Arsiran Garis Optik Terlihat Lembut & Jelas) -->
  <g filter="url(#blurFineHatch)">
    <path d="M0 48 C320 20, 630 80, 990 40 C1270 10, 1460 66, 1600 36" fill="none" stroke="#0ea5e9" stroke-opacity="0.32" stroke-width="2.5" />
    <path d="M0 135 C340 95, 670 165, 1050 115 C1320 80, 1490 145, 1600 110" fill="none" stroke="#38bdf8" stroke-opacity="0.26" stroke-width="2" />
    <path d="M0 225 C350 175, 700 255, 1090 195 C1350 150, 1500 225, 1600 185" fill="none" stroke="#0284c7" stroke-opacity="0.28" stroke-width="2.4" />
    <path d="M0 315 C360 265, 720 345, 1120 280 C1370 230, 1510 305, 1600 265" fill="none" stroke="#0ea5e9" stroke-opacity="0.24" stroke-width="2" />
    <path d="M0 405 C370 350, 740 430, 1150 365 C1390 315, 1520 390, 1600 350" fill="none" stroke="#38bdf8" stroke-opacity="0.27" stroke-width="2.2" />
    <path d="M0 495 C380 440, 760 520, 1180 450 C1410 400, 1530 475, 1600 435" fill="none" stroke="#0284c7" stroke-opacity="0.25" stroke-width="2" />
    <path d="M0 585 C390 530, 780 610, 1210 540 C1430 490, 1540 560, 1600 520" fill="none" stroke="#0ea5e9" stroke-opacity="0.28" stroke-width="2.4" />
    <path d="M0 675 C400 620, 800 700, 1230 625 C1450 575, 1550 645, 1600 610" fill="none" stroke="#38bdf8" stroke-opacity="0.24" stroke-width="2" />
    <path d="M0 765 C410 710, 820 790, 1250 715 C1460 665, 1560 735, 1600 700" fill="none" stroke="#0284c7" stroke-opacity="0.27" stroke-width="2.2" />
    <path d="M0 855 C420 800, 840 880, 1270 805 C1480 755, 1570 825, 1600 790" fill="none" stroke="#0ea5e9" stroke-opacity="0.25" stroke-width="2" />
    <path d="M0 945 C430 890, 860 970, 1290 895 C1500 845, 1580 915, 1600 880" fill="none" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="2.4" />
    <path d="M0 1035 C440 980, 880 1060, 1310 985 C1510 935, 1590 1005, 1600 970" fill="none" stroke="#0284c7" stroke-opacity="0.24" stroke-width="2" />
    <path d="M0 1125 C450 1070, 900 1150, 1330 1075 C1530 1025, 1600 1095, 1600 1060" fill="none" stroke="#0ea5e9" stroke-opacity="0.26" stroke-width="2.2" />
  </g>
</svg>
