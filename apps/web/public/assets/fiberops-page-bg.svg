<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="none">
  <defs>
    <!-- Gaussian Blur Filters for Abstract Blurred Blue Lines -->
    <filter id="blurHeavy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26" />
    </filter>
    <filter id="blurMedium" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="11" />
    </filter>
    <filter id="blurSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4.5" />
    </filter>

    <!-- Gradients for Abstract Blue Blur Ribbons & Lines -->
    <linearGradient id="topHeaderStreamA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.34" />
      <stop offset="32%" stop-color="#0ea5e9" stop-opacity="0.26" />
      <stop offset="68%" stop-color="#60a5fa" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.22" />
    </linearGradient>

    <linearGradient id="topHeaderStreamB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="85%" stop-color="#93c5fd" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="abstractLine1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="75%" stop-color="#60a5fa" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.06" />
    </linearGradient>

    <linearGradient id="abstractLine2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.12" />
      <stop offset="40%" stop-color="#0ea5e9" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.14" />
    </linearGradient>

    <linearGradient id="abstractRibbonFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.38" />
      <stop offset="45%" stop-color="#e0f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Dominant Clean White Canvas Base -->
  <rect width="1600" height="1000" fill="#ffffff" />

  <!-- 1. Upper Header Zone Abstract Blurred Blue Streams (Reveals Transparent Header Glass Effect) -->
  <g filter="url(#blurHeavy)">
    <path d="M-40 18 C280 -12, 560 72, 920 24 C1180 -10, 1410 58, 1640 14 L1640 82 C1410 116, 1180 48, 920 82 C560 128, 280 48, -40 78 Z" fill="url(#topHeaderStreamA)" />
    <path d="M180 -20 C520 45, 880 -15, 1260 42 C1420 66, 1540 20, 1640 35" fill="none" stroke="url(#topHeaderStreamB)" stroke-width="34" stroke-linecap="round" />
  </g>

  <g filter="url(#blurMedium)">
    <path d="M-20 34 C310 6, 620 68, 980 28 C1260 -2, 1450 54, 1620 26" fill="none" stroke="url(#abstractLine1)" stroke-width="9" stroke-linecap="round" />
    <path d="M60 62 C410 92, 740 18, 1120 58 C1350 82, 1490 38, 1620 52" fill="none" stroke="url(#abstractLine2)" stroke-width="6.5" stroke-linecap="round" />
  </g>

  <!-- 2. Sweeping Diagonal Abstract Blurred Blue Ribbons Across Main White Canvas -->
  <g filter="url(#blurHeavy)">
    <path d="M-60 210 C320 150, 680 280, 1080 190 C1340 130, 1490 220, 1660 175 L1660 255 C1490 300, 1340 210, 1080 270 C680 360, 320 230, -60 290 Z" fill="url(#abstractRibbonFill)" />
    <path d="M-40 540 C360 460, 740 620, 1160 510 C1380 450, 1510 530, 1640 490" fill="none" stroke="url(#topHeaderStreamA)" stroke-width="26" stroke-linecap="round" opacity="0.55" />
    <path d="M120 830 C520 740, 910 890, 1320 780 C1470 740, 1560 790, 1640 760" fill="none" stroke="url(#topHeaderStreamB)" stroke-width="24" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- 3. Medium & Soft Blurred Abstract Optic Blue Lines (Dynamic Layered Depth on White) -->
  <g filter="url(#blurMedium)">
    <path d="M-30 195 C340 135, 700 265, 1100 175 C1350 120, 1490 205, 1630 165" fill="none" stroke="url(#abstractLine1)" stroke-width="7.5" stroke-linecap="round" />
    <path d="M-30 245 C360 190, 720 310, 1120 225 C1370 170, 1500 250, 1630 215" fill="none" stroke="url(#abstractLine2)" stroke-width="5" stroke-linecap="round" />
    <path d="M-20 485 C350 545, 730 415, 1130 505 C1370 560, 1500 475, 1630 515" fill="none" stroke="url(#abstractLine2)" stroke-width="6.5" stroke-linecap="round" opacity="0.75" />
    <path d="M-20 745 C380 685, 760 805, 1180 715 C1400 665, 1520 735, 1630 700" fill="none" stroke="url(#abstractLine1)" stroke-width="6" stroke-linecap="round" opacity="0.65" />
  </g>

  <g filter="url(#blurSoft)">
    <path d="M0 44 C330 16, 640 74, 1000 34 C1270 4, 1460 58, 1600 30" fill="none" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="2.2" />
    <path d="M0 208 C345 148, 705 275, 1105 188 C1355 132, 1495 215, 1600 178" fill="none" stroke="#0ea5e9" stroke-opacity="0.22" stroke-width="2" />
    <path d="M0 498 C355 555, 735 428, 1135 515 C1375 568, 1505 485, 1600 522" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1.8" />
  </g>
</svg>
