<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1200" viewBox="0 0 320 1200" preserveAspectRatio="none">
  <defs>
    <!-- Deep Atmospheric Sky Base with Vibrant Azure-to-Cerulean Depth -->
    <linearGradient id="cloudSkyBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8e0fe"/>
      <stop offset="18%" stop-color="#cae8fe"/>
      <stop offset="36%" stop-color="#b0dcfe"/>
      <stop offset="55%" stop-color="#9cd2fc"/>
      <stop offset="72%" stop-color="#b6e0fd"/>
      <stop offset="88%" stop-color="#a4d7fc"/>
      <stop offset="100%" stop-color="#bee3fe"/>
    </linearGradient>

    <!-- Cloud Volume Gaussian Blur Filter -->
    <filter id="cloudSoftBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>

    <filter id="cloudPuffBlur" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="16" />
    </filter>

    <!-- Volumetric Cloud Fills (Thick, Opaque White to Translucent Billows) -->
    <linearGradient id="thickCloudPrimary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="70%" stop-color="#e2f2fe" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c6e5fd" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="thickCloudSecondary" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="45%" stop-color="#f0f7fe" stop-opacity="0.82"/>
      <stop offset="80%" stop-color="#d4ecfd" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#bce0fc" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="cloudTopHighlight" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#dbeffd" stop-opacity="0.4"/>
    </linearGradient>

    <radialGradient id="cloudPuffRadial1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#c0e2fc" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cloudPuffRadial2" cx="70%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#b8defe" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky Canvas Base -->
  <rect width="320" height="1200" fill="url(#cloudSkyBase)"/>

  <!-- 1. Upper Sky Cloud Swells (Behind Brand Logo & Top Workspace) -->
  <g filter="url(#cloudPuffBlur)">
    <circle cx="270" cy="90" r="110" fill="url(#cloudPuffRadial1)" />
    <circle cx="60" cy="140" r="95" fill="url(#cloudPuffRadial2)" />
    <ellipse cx="180" cy="180" rx="160" ry="70" fill="#ffffff" opacity="0.65" />
  </g>
  <path d="M-20 160 C60 130, 160 145, 240 115 C280 100, 310 110, 340 95 L340 220 C280 235, 180 210, 80 230 C20 242, -10 230, -20 220 Z" fill="url(#cloudTopHighlight)" />

  <!-- 2. Mid-Level Volumetric Cloud Formation (Between Workspace & Management) -->
  <g filter="url(#cloudPuffBlur)">
    <ellipse cx="280" cy="460" rx="140" ry="90" fill="url(#cloudPuffRadial1)" />
    <circle cx="80" cy="520" r="115" fill="url(#cloudPuffRadial2)" />
    <circle cx="220" cy="580" r="130" fill="url(#cloudPuffRadial1)" />
  </g>
  <path d="M340 370 C240 400, 190 480, 260 550 C300 590, 320 620, 340 640 Z" fill="url(#thickCloudSecondary)" />
  <path d="M340 370 C240 400, 190 480, 260 550 C300 590, 320 620, 340 640" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9" />

  <!-- 3. Heavy Billowing Cloud Bank (Dramatic, Thick Tier 1 at Lower-Mid Section) -->
  <g filter="url(#cloudSoftBlur)">
    <circle cx="60" cy="740" r="120" fill="url(#cloudPuffRadial1)" />
    <circle cx="240" cy="720" r="110" fill="url(#cloudPuffRadial2)" />
  </g>
  <path d="M-20 780 C70 730, 170 750, 240 680 C280 640, 310 660, 340 630 L340 1200 L-20 1200 Z" fill="url(#thickCloudPrimary)"/>
  <path d="M-20 780 C70 730, 170 750, 240 680 C280 640, 310 660, 340 630" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.95"/>

  <!-- 4. Deep Billowing Cloud Tier 2 (Opaque White Rolling Clouds at Bottom Section) -->
  <g filter="url(#cloudSoftBlur)">
    <circle cx="160" cy="910" r="135" fill="url(#cloudPuffRadial1)" />
    <circle cx="290" cy="870" r="100" fill="url(#cloudPuffRadial2)" />
  </g>
  <path d="M-20 920 C60 880, 150 900, 230 830 C280 785, 310 810, 340 770 L340 1200 L-20 1200 Z" fill="url(#thickCloudSecondary)"/>
  <path d="M-20 920 C60 880, 150 900, 230 830 C280 785, 310 810, 340 770" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-opacity="0.98"/>

  <!-- 5. Bottom Cloud Horizon Base (Solid Pure White Cloud Mass) -->
  <path d="M-20 1040 C70 1010, 160 1030, 240 970 C280 940, 310 960, 340 930 L340 1200 L-20 1200 Z" fill="#ffffff" opacity="0.92"/>
  <path d="M-20 1040 C70 1010, 160 1030, 240 970 C280 940, 310 960, 340 930" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9"/>

  <path d="M-20 1130 C80 1110, 180 1120, 260 1080 C290 1065, 320 1075, 340 1060 L340 1200 L-20 1200 Z" fill="#ffffff"/>

  <!-- Right Divider Accent Line -->
  <path d="M319 0 L319 1200" stroke="#bae0fd" stroke-opacity="0.9" stroke-width="1"/>
</svg>
