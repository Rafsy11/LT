<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1200" viewBox="0 0 320 1200" preserveAspectRatio="none">
  <defs>
    <!-- Base Sky Gradient from Lintasarta Sky Dashboard -->
    <linearGradient id="sideSkyBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7edfe"/>
      <stop offset="22%" stop-color="#e5f3fd"/>
      <stop offset="48%" stop-color="#cde7fa"/>
      <stop offset="68%" stop-color="#badefd"/>
      <stop offset="88%" stop-color="#c2e2fb"/>
      <stop offset="100%" stop-color="#d0e9fe"/>
    </linearGradient>

    <!-- Translucent Wave Gradient 1 -->
    <linearGradient id="sideWaveFill1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#c4e3fb" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a4d5f7" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Translucent Wave Gradient 2 -->
    <linearGradient id="sideWaveFill2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#b4dcfa" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#cbe5fc" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#edf6ff" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Full Atmospheric Sky Tone -->
  <rect width="320" height="1200" fill="url(#sideSkyBase)"/>

  <!-- Upper-Right Subtle Cloud Swell (around management top) -->
  <path d="M320 420 C230 460, 210 530, 320 590 Z" fill="#ffffff" opacity="0.3"/>
  <path d="M320 420 C230 460, 210 530, 320 590" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.6"/>

  <!-- Primary Sweeping Diagonal Wave Ribbon (sampled from reference dashboard) -->
  <path d="M0 860 C90 840, 190 740, 320 660 L320 1200 L0 1200 Z" fill="url(#sideWaveFill1)"/>
  <path d="M0 860 C90 840, 190 740, 320 660" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>

  <!-- Secondary Deeper Wave Ribbon at Bottom-Left -->
  <path d="M0 990 C80 970, 180 890, 320 810 L320 1200 L0 1200 Z" fill="url(#sideWaveFill2)"/>
  <path d="M0 990 C80 970, 180 890, 320 810" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.8"/>

  <!-- Delicate Lower Accent Wave -->
  <path d="M0 1100 C70 1080, 170 1020, 320 960 L320 1200 L0 1200 Z" fill="#c2e2fb" opacity="0.35"/>
  <path d="M0 1100 C70 1080, 170 1020, 320 960" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Right Border Line -->
  <path d="M319 0 L319 1200" stroke="#c8e0f4" stroke-opacity="0.8" stroke-width="1"/>
</svg>